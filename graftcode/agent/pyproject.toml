[project]
name = "quinjet-agent"
version = "0.1.0"
description = "A Graftcode receiver that reasons about Quinjet repositories with Claude"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["anthropic>=2.8", "mcp>=2.3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quinjet_agent"]
