extends: default

rules:
  document-start: disable
  comments:
    min-spaces-from-content: 1
  line-length:
    max: 140
    allow-non-breakable-words: true
  truthy:
    check-keys: false
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
