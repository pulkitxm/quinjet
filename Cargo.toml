[package]
name = "quinjet"
version = "0.0.6"
edition = "2024"
description = "A fast, live, keyboard-first Git source-control interface for the terminal"
repository = "https://github.com/pulkitxm/quinjet"
homepage = "https://github.com/pulkitxm/quinjet"
documentation = "https://github.com/pulkitxm/quinjet#readme"
readme = "README.md"
license = "MIT"
rust-version = "1.88"
keywords = ["git", "tui", "terminal", "source-control", "diff"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["extras/", ".github/", ".agents/", "fuzz/"]

[package.metadata.binstall]
pkg-fmt = "bin"
pkg-url = "{ repo }/releases/download/v{ version }/quinjet-{ target-family }-{ target-arch }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/quinjet-linux-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/quinjet-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/quinjet-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/quinjet-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/quinjet-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/quinjet-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/quinjet-windows-x86_64.exe"

[package.metadata.deb]
maintainer = "Pulkit <pulkitxm@users.noreply.github.com>"
copyright = "2026, Pulkit"
license-file = ["LICENSE", "0"]
extended-description = "Quinjet is a live, keyboard-first Git source-control interface for the terminal. It combines repository status, syntax-highlighted diffs, commit history, branches, stashes, and pull requests in one executable."
depends = "git"
suggests = "gh"
section = "vcs"
priority = "optional"
revision = ""
assets = [
    ["target/release/quinjet", "usr/bin/", "755"],
    { dest = "usr/bin/q", link_name = "quinjet" },
    ["target/release/quinjet.bash", "usr/share/bash-completion/completions/quinjet", "644"],
    ["target/release/quinjet.fish", "usr/share/fish/vendor_completions.d/quinjet.fish", "644"],
    ["target/release/quinjet.zsh", "usr/share/zsh/vendor-completions/_quinjet", "644"],
    ["target/release/quinjet.1", "usr/share/man/man1/quinjet.1", "644"],
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
crossbeam-channel = "0.5"
crossterm = { version = "0.29", features = ["osc52"] }
dark-light = { version = "3.0", default-features = false }
hex = "0.4"
indicatif = { version = "0.18.3", features = ["in_memory"] }
notify = "8.0"
ratatui = "0.30"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tempfile = "3.20"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"

[lints.rust]
unsafe_code = "forbid"
deprecated_in_future = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
ffi_unwind_calls = "deny"
keyword_idents = { level = "deny", priority = -1 }
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_abi = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
unused_results = "deny"
variant_size_differences = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
multiple_inherent_impl = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
assertions_on_result_states = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
needless_raw_strings = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
ref_patterns = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
semicolon_inside_block = "deny"
str_to_string = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unimplemented = "deny"
unreachable = "deny"
unseparated_literal_suffix = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
expect_used = "deny"
verbose_file_reads = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
