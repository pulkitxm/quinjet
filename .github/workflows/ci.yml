name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint shell installer
        if: runner.os == 'Linux'
        run: shellcheck install.sh tests/install.sh
      - name: Test shell installer
        if: runner.os != 'Windows'
        run: sh tests/install.sh
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --locked

  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked
      - run: cargo install --path . --locked --root /tmp/quinjet-install
      - run: /tmp/quinjet-install/bin/quinjet --version
      - run: /tmp/quinjet-install/bin/quinjet --help >/dev/null
