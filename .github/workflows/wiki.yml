name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/check_optimization_docs.py'
      - 'scripts/sync_wiki.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Publish the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pukbot-production
    steps:
      - name: Require main for a manual sync
        if: github.event_name == 'workflow_dispatch'
        run: >-
          test "$GITHUB_REF" = refs/heads/main
          || { echo "sync blocked: select the main branch" >&2; exit 1; }
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: quinjet
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify optimization reference
        run: python3 scripts/check_optimization_docs.py --check
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: 'pukbot[bot]'
          GIT_AUTHOR_EMAIL: '320458784+pukbot[bot]@users.noreply.github.com'
        run: python3 scripts/sync_wiki.py --push
