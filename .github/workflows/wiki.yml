name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/sync_wiki.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read # read the checkout

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Publish the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the generated pages to the wiki repository
    steps:
      - name: Require main for a manual sync
        if: github.event_name == 'workflow_dispatch'
        run: >-
          test "$GITHUB_REF" = refs/heads/main
          || { echo "sync blocked: select the main branch" >&2; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: python3 scripts/sync_wiki.py --push
