name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  full-check:
    name: Full check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-machete,cargo-hack,cargo-llvm-cov,shellcheck,shfmt,taplo-cli,typos,zizmor,editorconfig-checker
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Install the remaining checkers
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          pipx install yamllint
          npm install --global markdownlint-cli2
      - name: make ci
        run: make ci

  future-toolchain:
    name: Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml './**/*.md'
          fail: true

  report:
    name: Report
    if: always() && contains(needs.*.result, 'failure')
    needs: [full-check, future-toolchain, links]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly CI failed'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The scheduled full check failed: ${runUrl}`
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'nightly' })
            const existing = issues.find((i) => i.title === title)
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['nightly'] })
