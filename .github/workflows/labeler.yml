name: Label PRs

on: pull_request_target

permissions:
  contents: read
  pull-requests: write

jobs:
  area:
    name: Area labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true

  size:
    name: Size label
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/size-label-action@v0.5.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORED: |
            Cargo.lock
