name: Label PRs

on: pull_request_target

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  area:
    name: Area labels
    runs-on: ubuntu-26.04
    environment: pukbot-production
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: quinjet
          permission-contents: read
          permission-pull-requests: write
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          sync-labels: true

  size:
    name: Size label
    runs-on: ubuntu-26.04
    environment: pukbot-production
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: quinjet
          permission-contents: read
          permission-pull-requests: write
      - uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          IGNORED: |
            Cargo.lock
