name: Hygiene

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read # read the checkout

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No disallowed comments
        run: |
          python3 scripts/check_comments.py --selftest
          python3 scripts/check_comments.py
      - name: The Homebrew formula template renders
        run: python3 scripts/homebrew_formula.py --selftest
      - name: No committed secrets
        run: |
          python3 scripts/check_secrets.py --selftest
          python3 scripts/check_secrets.py
      - name: Subprocesses stay inside the Git layer
        run: |
          set -euo pipefail
          stray=$(git grep -ln 'Command::new' -- 'src/**/*.rs' \
            | grep -v -e '^src/git/' -e '^src/cli/' -e '^src/main.rs$' || true)
          if [ -n "${stray}" ]; then
            echo "${stray}" >&2
            echo 'spawn processes from src/git or src/cli so arguments stay shell-free' >&2
            exit 1
          fi
      - name: No stray debug markers
        run: |
          set -euo pipefail
          if git grep -nE '\b(dbg!|todo!|unimplemented!|FIXME|XXX[^X]|eprintln!)' -- 'src/**/*.rs'; then
            echo "remove the markers above before merging" >&2
            exit 1
          fi
      - name: No large files
        # docs/practices/rust-dump.md is the practices reference deliberately
        # bound into one searchable text file; it is the one tracked file
        # allowed past the blob cap.
        run: |
          set -euo pipefail
          oversized=$(git ls-files -z \
            | grep -zv '^docs/practices/rust-dump\.md$' \
            | xargs -0 -r -I{} find {} -size +512k -print)
          if [ -n "${oversized}" ]; then
            echo "${oversized}" >&2
            echo "tracked files over 512k" >&2
            exit 1
          fi
      - name: Text files end with a newline
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r -d '' file; do
            case "${file}" in
              *.png | *.jpg | *.jpeg | *.gif | *.ico | *.pdf) continue ;;
            esac
            if [ -s "${file}" ] && [ -n "$(tail -c 1 "${file}")" ]; then
              echo "${file}: missing trailing newline" >&2
              rc=1
            fi
          done < <(git ls-files -z)
          exit "${rc}"

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: editorconfig-checker
      - run: editorconfig-checker

  toml:
    name: TOML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: taplo-cli,cargo-sort
      - run: taplo fmt --check --diff
      - run: taplo lint
      - run: cargo sort --check --check-format

  doc-comments:
    name: Doc comment spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-spellcheck
      - run: cargo spellcheck --code 1 check

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install yamllint
      - run: yamllint --strict .

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: shellcheck,shfmt
      - run: shellcheck --severity=style --enable=all install.sh tests/install.sh
      - run: shfmt --diff --indent 4 --case-indent install.sh tests/install.sh

  powershell:
    name: PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($findings) { $findings | Format-Table -AutoSize; exit 1 }

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check scripts
      - name: Format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check scripts

  actions:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: zizmor
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: zizmor
        run: zizmor --persona=pedantic --format=plain .github/workflows

  links:
    name: Links
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml './**/*.md'
          fail: true

  wiki:
    name: Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Optimization reference satisfies its generated contract
        run: python3 scripts/check_optimization_docs.py --check
      - name: Every page builds and every link resolves
        run: python3 scripts/sync_wiki.py --check

  hygiene:
    name: Hygiene
    if: always()
    needs:
      - repo
      - typos
      - editorconfig
      - toml
      - doc-comments
      - yaml
      - markdown
      - shell
      - powershell
      - python
      - actions
      - links
      - wiki
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "hygiene is clean"
