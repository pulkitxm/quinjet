name: Stale

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read # read the checkout

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    name: Sweep
    runs-on: ubuntu-latest
    permissions:
      issues: write # open or update the tracking issue
      pull-requests: write # write labels and summaries onto the pull request
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: 45
          days-before-close: 14
          exempt-issue-labels: 'pinned,security,nightly'
          exempt-pr-labels: 'pinned,security'
          stale-issue-message: >-
            This issue has had no activity for 45 days. Comment to keep it open,
            otherwise it closes in 14 days.
          stale-pr-message: >-
            This pull request has had no activity for 45 days. Comment or push to keep it
            open, otherwise it closes in 14 days.
          operations-per-run: 100
