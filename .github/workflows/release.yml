name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Choose the next patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          IFS=. read -r major minor patch <<<"${current}"
          for _ in $(seq 1 100); do
            patch=$((patch + 1))
            next="${major}.${minor}.${patch}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A quinjet-release "https://crates.io/api/v1/crates/quinjet/${next}")
            case "${code}" in
              404) ;;
              200) continue ;;
              *) echo "unexpected crates.io status ${code} for ${next}" >&2; exit 1 ;;
            esac
            if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then continue; fi
            echo "version=${next}" >>"${GITHUB_OUTPUT}"
            echo "tag=v${next}" >>"${GITHUB_OUTPUT}"
            echo "releasing ${current} -> ${next}"
            exit 0
          done
          echo "no free patch version after ${current}" >&2
          exit 1
      - name: Apply the version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          cargo update --workspace
          test "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')" = "${VERSION}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - name: Commit the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${VERSION}"
      - run: cargo package --locked
      - name: Tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "quinjet v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: quinjet-linux-x86_64
            binary: quinjet
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: quinjet-linux-aarch64
            binary: quinjet
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: quinjet-macos-x86_64
            binary: quinjet
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: quinjet-macos-aarch64
            binary: quinjet
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: quinjet-windows-x86_64.exe
            binary: quinjet.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      - uses: Swatinem/rust-cache@v2
      - name: Build with an embedded dependency list
        run: cargo auditable build --release --locked --target ${{ matrix.target }}
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}
      - name: Smoke test artifact (Unix)
        if: runner.os != 'Windows'
        run: ./${{ matrix.artifact }} --version
      - name: Smoke test artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./${{ matrix.artifact }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publish crate and release
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A quinjet-release "https://crates.io/api/v1/crates/quinjet/${VERSION}")
          if [ "${code}" = 200 ]; then
            echo "quinjet ${VERSION} is already published"
            exit 0
          fi
          test "${code}" = 404
          test -n "${CARGO_REGISTRY_TOKEN}"
          cargo publish --locked
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum quinjet-* > SHA256SUMS
      - uses: taiki-e/install-action@v2
        with:
          tool: syft
      - name: Generate an SBOM for the released binaries
        run: syft scan dir:dist --output cyclonedx-json=dist/quinjet-sbom.cdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/quinjet-*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
