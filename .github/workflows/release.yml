name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read # read the checkout

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump, tag and release assets
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] the job pushes the version bump and tag
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Choose the next patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          IFS=. read -r major minor patch <<<"${current}"
          for _ in $(seq 1 100); do
            patch=$((patch + 1))
            next="${major}.${minor}.${patch}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A quinjet-release "https://crates.io/api/v1/crates/quinjet/${next}")
            case "${code}" in
              404) ;;
              200) continue ;;
              *) echo "unexpected crates.io status ${code} for ${next}" >&2; exit 1 ;;
            esac
            if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then continue; fi
            echo "version=${next}" >>"${GITHUB_OUTPUT}"
            echo "tag=v${next}" >>"${GITHUB_OUTPUT}"
            echo "releasing ${current} -> ${next}"
            exit 0
          done
          echo "no free patch version after ${current}" >&2
          exit 1
      - name: Apply the version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          cargo update --workspace
          test "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')" = "${VERSION}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      # main only accepts changes through a reviewed pull request, so the bump
      # lives on the tag rather than on the branch. The next version is read
      # from crates.io, not from the manifest, so releases keep advancing.
      - name: Commit the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${VERSION}"
      - run: cargo package --locked
      - name: Tag the release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "quinjet v${VERSION}"
          git push origin "v${VERSION}"

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: quinjet-linux-x86_64
            binary: quinjet
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: quinjet-linux-aarch64
            binary: quinjet
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: quinjet-macos-x86_64
            binary: quinjet
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: quinjet-macos-aarch64
            binary: quinjet
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: quinjet-windows-x86_64.exe
            binary: quinjet.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-auditable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build with an embedded dependency list
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo auditable build --release --locked --target "${TARGET}"
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: cp "target/${TARGET}/release/${BINARY}" "${ARTIFACT}"
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: Copy-Item "target/$env:TARGET/release/$env:BINARY" "$env:ARTIFACT"
      - name: Smoke test artifact (Unix)
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: '"./${ARTIFACT}" --version'
      - name: Smoke test artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: '& "./$env:ARTIFACT" --version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publish crate and release
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write # push the version bump, tag and release assets
      id-token: write # authenticate through OIDC
      attestations: write # record the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          lookup-only: true
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A quinjet-release "https://crates.io/api/v1/crates/quinjet/${VERSION}")
          if [ "${code}" = 200 ]; then
            echo "quinjet ${VERSION} is already published"
            exit 0
          fi
          test "${code}" = 404
          test -n "${CARGO_REGISTRY_TOKEN}"
          cargo publish --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum quinjet-* > SHA256SUMS
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: syft
      - name: Generate an SBOM for the released binaries
        run: syft scan dir:dist --output cyclonedx-json=dist/quinjet-sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/quinjet-*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
