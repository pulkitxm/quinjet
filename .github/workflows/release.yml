name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'Formula/quinjet.rb'
      - 'packaging/winget/**'
      - 'scripts/homebrew_formula.py'
      - 'scripts/update_homebrew_tap.sh'
      - 'scripts/winget_manifest.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-26.04
    environment: pukbot-production
    env:
      GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Install Pukbot
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/pukbot"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/pulkitxm/pukbot/releases/download/v0.3.32/pukbot-linux-x86_64 \
            --output "${binary}"
          printf '%s  %s\n' aaf47ccf6f8dd89722c3ee94b6fa6a05f5ab7a833cdd19fa2948c652f77a658e "${binary}" | sha256sum --check
          chmod +x "${binary}"
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Choose the next patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          IFS=. read -r major minor patch <<<"${current}"
          for _ in $(seq 1 100); do
            patch=$((patch + 1))
            next="${major}.${minor}.${patch}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A quinjet-release "https://crates.io/api/v1/crates/quinjet/${next}")
            case "${code}" in
              404) ;;
              200) continue ;;
              *) echo "unexpected crates.io status ${code} for ${next}" >&2; exit 1 ;;
            esac
            if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then continue; fi
            echo "version=${next}" >>"${GITHUB_OUTPUT}"
            echo "tag=v${next}" >>"${GITHUB_OUTPUT}"
            echo "releasing ${current} -> ${next}"
            exit 0
          done
          echo "no free patch version after ${current}" >&2
          exit 1
      - name: Apply the version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          cargo update --workspace
          test "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')" = "${VERSION}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - name: Commit the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock
          pukbot commit create --repo "${GITHUB_REPOSITORY}" --branch main \
            --message "chore: release v${VERSION} [skip ci]" --json
      - run: cargo package --locked --target-dir "${RUNNER_TEMP}/cargo-package"
      - name: Publish the release commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          pukbot tag create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --target "$(git rev-parse HEAD)" --message "quinjet v${VERSION}" --json

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            artifact: quinjet-linux-x86_64
            binary: quinjet
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: quinjet-linux-aarch64
            binary: quinjet
            deb_arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: quinjet-macos-x86_64
            binary: quinjet
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: quinjet-macos-aarch64
            binary: quinjet
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: quinjet-windows-x86_64.exe
            binary: quinjet.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-auditable@0.7.7
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        if: runner.os == 'Linux' && runner.arch == 'X64'
        with:
          tool: cargo-deb@3.7.0
      - name: Build cargo-deb from source
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: cargo install cargo-deb@3.7.0 --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build with an embedded dependency list
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "${TARGET}" = x86_64-unknown-linux-musl ]; then
            version=$(rustc --version)
            version=${version#rustc }
            major=${version%%.*}
            version=${version#*.}
            minor=${version%%.*}
            if [ "${major}" -lt 1 ] || { [ "${major}" -eq 1 ] && [ "${minor}" -lt 93 ]; }; then
              echo 'packed musl relocations require Rust 1.93 or newer' >&2
              exit 1
            fi
            export RUSTFLAGS='-C link-arg=-Wl,-z,pack-relative-relocs'
          fi
          if [ "${TARGET}" = x86_64-pc-windows-msvc ]; then
            export RUSTFLAGS='-C target-feature=+crt-static'
          fi
          cargo auditable build --release --locked --target "${TARGET}"
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: cp "target/${TARGET}/release/${BINARY}" "${ARTIFACT}"
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: Copy-Item "target/$env:TARGET/release/$env:BINARY" "$env:ARTIFACT"
      - name: Smoke test artifact (Unix)
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: '"./${ARTIFACT}" --version'
      - name: Smoke test artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: '& "./$env:ARTIFACT" --version'
      - name: Verify the portable Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: ./scripts/check_windows_release.ps1 -Binary $env:ARTIFACT
      - name: Build Debian package
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/quinjet"
          "${binary}" completions bash >"target/${TARGET}/release/quinjet.bash"
          "${binary}" completions fish >"target/${TARGET}/release/quinjet.fish"
          "${binary}" completions zsh >"target/${TARGET}/release/quinjet.zsh"
          "${binary}" man >"target/${TARGET}/release/quinjet.1"
          cargo deb --no-build --no-strip --target "${TARGET}" \
            --output "quinjet_${VERSION}_${DEB_ARCH}.deb"
      - name: Smoke test Debian package
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          package="quinjet_${VERSION}_${DEB_ARCH}.deb"
          dpkg-deb --info "${package}"
          sudo apt-get install --yes "./${package}"
          quinjet --version
          q --version
          test -s /usr/share/bash-completion/completions/quinjet
          test -s /usr/share/fish/vendor_completions.d/quinjet.fish
          test -s /usr/share/zsh/vendor-completions/_quinjet
          test -s /usr/share/man/man1/quinjet.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: quinjet-deb-${{ matrix.deb_arch }}
          path: quinjet_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb

  publish-crate:
    name: Publish crate
    needs: [version, build]
    runs-on: ubuntu-26.04
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check crate version
        id: crate
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A quinjet-release "https://crates.io/api/v1/crates/quinjet/${VERSION}")
          test "${code}" = 200 || test "${code}" = 404
          if [ "${code}" = 404 ]; then echo "publish=true" >>"${GITHUB_OUTPUT}"; fi
      - name: Publish to crates.io
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --target-dir "${RUNNER_TEMP}/cargo-package"

  release:
    name: Publish GitHub release
    needs: [version, build, publish-crate]
    runs-on: ubuntu-26.04
    environment: pukbot-production
    env:
      GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: quinjet
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install Pukbot
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/pukbot"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/pulkitxm/pukbot/releases/download/v0.3.32/pukbot-linux-x86_64 \
            --output "${binary}"
          printf '%s  %s\n' aaf47ccf6f8dd89722c3ee94b6fa6a05f5ab7a833cdd19fa2948c652f77a658e "${binary}" | sha256sum --check
          chmod +x "${binary}"
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Prepare Winget archive
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/winget-archive"
          mkdir "${archive}"
          cp dist/quinjet-windows-x86_64.exe "${archive}/quinjet.exe"
          cp dist/quinjet-windows-x86_64.exe "${archive}/q.exe"
          (cd "${archive}" && zip -9 "${GITHUB_WORKSPACE}/dist/quinjet-windows-x86_64.zip" ./*.exe)
      - name: Generate checksums
        working-directory: dist
        run: sha256sum quinjet-* > SHA256SUMS
      - name: Render Winget manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          manifests="${RUNNER_TEMP}/winget-manifests"
          python3 scripts/winget_manifest.py \
            --version "${VERSION}" \
            --release-date "$(date -u +%F)" \
            --checksums dist/SHA256SUMS \
            --output-dir "${manifests}"
          (cd "${manifests}" && zip -9 "${GITHUB_WORKSPACE}/dist/quinjet-winget-manifests.zip" ./*.yaml)
          (cd dist && sha256sum quinjet-* >SHA256SUMS)
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: syft
      - name: Generate an SBOM for the released binaries
        run: syft scan dir:dist --output cyclonedx-json=dist/quinjet-sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/quinjet-*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
      - name: Render the Homebrew formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/homebrew_formula.py \
            --version "${VERSION}" --checksums dist/SHA256SUMS --output quinjet.rb
      - name: Mirror the formula to the tap repository
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/pulkitxm/homebrew-tap.git tap
          cp quinjet.rb tap/Formula/quinjet.rb
          git -C tap add Formula/quinjet.rb
          if ! git -C tap diff --cached --quiet; then
            (cd tap && pukbot commit create --repo pulkitxm/homebrew-tap --branch main \
              --message "chore: update Quinjet to ${TAG}" --json)
          fi
          test "$(git -C tap ls-remote origin refs/heads/main | cut -f1)" = "$(git -C tap rev-parse HEAD)" \
            || { echo "release blocked: the tap did not take ${TAG}" >&2; exit 1; }
      - name: Deploy package repositories
        run: pukbot repository dispatch apt-release --repo "${GITHUB_REPOSITORY}" --json
