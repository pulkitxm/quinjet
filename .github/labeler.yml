rust:
  - changed-files:
      - any-glob-to-any-file: ['src/**/*.rs', 'Cargo.toml', 'Cargo.lock']
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']
ui:
  - changed-files:
      - any-glob-to-any-file: ['src/ui/**', 'src/app.rs']
git:
  - changed-files:
      - any-glob-to-any-file: ['src/git/**', 'src/watch.rs']
cli:
  - changed-files:
      - any-glob-to-any-file: ['src/cli/**', 'src/main.rs', 'docs/cli/**']
