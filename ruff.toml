line-length = 100
target-version = "py311"

[lint]
select = ["ALL"]
ignore = [
  "ANN",
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "ISC001",
  "S603",
  "S607",
  "T201",
]

[lint.per-file-ignores]
# The driver is a local experiment harness, not part of the shipped tool.
"scripts/drive.py" = ["D", "PLR2004", "INP001", "PTH111", "PLW1509", "PLW1510"]

[format]
quote-style = "double"
